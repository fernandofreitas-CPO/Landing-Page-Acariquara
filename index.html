<!doctype html>
<html lang="pt-BR" class="bg-[#0E0C0A]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Acariquara Tech — Feito pra durar como a acariquara.</title>
    <meta name="description" content="Sistemas sob medida. Feitos em Manaus. Feitos pra durar como a acariquara." />
    <meta property="og:title" content="Acariquara Tech — Feito pra durar como a acariquara." />
    <meta property="og:description" content="Sistemas sob medida. Feitos em Manaus. Feitos pra durar como a acariquara." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0E0C0A" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,700..900;1,62..125,700..900&family=Covered+By+Your+Grace&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0E0C0A] text-[#0E0C0A] antialiased selection:bg-[#FF4A1C] selection:text-[#EFE6D2] overflow-x-hidden min-h-screen">
    <!-- Static SVG displacement filter for scissors cut edges -->
    <svg width="0" height="0" class="absolute pointer-events-none opacity-0" aria-hidden="true">
      <defs>
        <filter id="paper-edge" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="paper-edge-rough" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
